<!DOCTYPE html>
<html lang="ky">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Тундук — Кыргызча AI жардамчы</title>
<link rel="icon" type="image/png" href="./tunduk-logo.png" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./tunduk-logo.png" />

<meta name="mobile-web-app-capable" content="yes" />

/>
<style>
  html, body, #root { margin: 0; padding: 0; height: 100%; background: #14171F; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #2A2F42; border-radius: 8px; }
  textarea:focus, button:focus-visible { outline: 2px solid #E8B84B; outline-offset: 2px; }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  .dot { animation: pulse 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/lamejs@1.2.1/lame.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const TundukMark = ({ size = 28 }) => (
  <img src="./tunduk-logo.png" alt="Тундук" style={{ width: size, height: size, objectFit: "contain" }} />
);

function App() {
  const [conversations, setConversations] = useState(() => {
    try {
      const saved = localStorage.getItem("tunduk_conversations");
      if (saved) return JSON.parse(saved);
    } catch {}
    return [];
  });
  const [currentId, setCurrentId] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [mode, setMode] = useState("chat");
  const [lyrics, setLyrics] = useState("");
  const [videoStage, setVideoStage] = useState("");
  const [videoUrl, setVideoUrl] = useState(null);
  const [videoProgress, setVideoProgress] = useState("");
  const [videoExt, setVideoExt] = useState("webm");
  const [cartoonStory, setCartoonStory] = useState("");
  const [cartoonCharacters, setCartoonCharacters] = useState("wolf_hare");
  const [cartoonRealVideo, setCartoonRealVideo] = useState(false);
  const canvasRef = useRef(null);
  const [usage, setUsage] = useState(null);
  const scrollRef = useRef(null);

  const defaultGreeting = { role: "assistant", content: "Салам! Мен — Тундук, сиздин кыргызча AI жардамчыңыз. Күнүмдүк суроолордон тартып, физика, биология, астрономия, тарых сыяктуу дүйнөлүк илимдердин темаларына чейин — эмне жөнүндө болсо да сурай бериңиз!" };

  useEffect(() => {
    if (conversations.length === 0) {
      const newConv = { id: Date.now().toString(), title: "Жаңы сүйлөшүү", messages: [defaultGreeting], createdAt: Date.now() };
      setConversations([newConv]);
      setCurrentId(newConv.id);
    } else if (!currentId) {
      setCurrentId(conversations[0].id);
    }
  }, []);

  const [storageWarning, setStorageWarning] = useState(false);

  useEffect(() => {
    if (conversations.length === 0) return;
    try {
      localStorage.setItem("tunduk_conversations", JSON.stringify(conversations));
      setStorageWarning(false);
    } catch (e) {
      try {
        const lightweight = conversations.map((c) => ({
          ...c,
          messages: c.messages.map((m) =>
            m.type === "image" ? { role: m.role, type: "image", content: "", caption: m.caption } : m
          ),
        }));
        localStorage.setItem("tunduk_conversations", JSON.stringify(lightweight));
        setStorageWarning(true);
      } catch (e2) {
        setStorageWarning(true);
      }
    }
  }, [conversations]);

  const currentConv = conversations.find((c) => c.id === currentId) || conversations[0];
  const messages = currentConv ? currentConv.messages : [defaultGreeting];

  useEffect(() => {
    scrollRef.current && scrollRef.current.scrollTo({ top: scrollRef.current.scrollHeight, behavior: "smooth" });
  }, [messages, loading]);

  const updateMessages = (newMessages) => {
    setConversations((prev) =>
      prev.map((c) => {
        if (c.id !== currentId) return c;
        let title = c.title;
        if (title === "Жаңы сүйлөшүү") {
          const firstUser = newMessages.find((m) => m.role === "user");
          if (firstUser) title = firstUser.content.slice(0, 34) + (firstUser.content.length > 34 ? "..." : "");
        }
        return { ...c, messages: newMessages, title };
      })
    );
  };

  const startNewChat = () => {
    const newConv = { id: Date.now().toString(), title: "Жаңы сүйлөшүү", messages: [defaultGreeting], createdAt: Date.now() };
    setConversations((prev) => [newConv, ...prev]);
    setCurrentId(newConv.id);
    setSidebarOpen(false);
    setError(null);
    setMode("chat");
  };

  const switchConversation = (id) => {
    setCurrentId(id);
    setSidebarOpen(false);
    setError(null);
  };

  const deleteConversation = (id, e) => {
    e.stopPropagation();
    setConversations((prev) => {
      const filtered = prev.filter((c) => c.id !== id);
      if (filtered.length === 0) {
        const newConv = { id: Date.now().toString(), title: "Жаңы сүйлөшүү", messages: [defaultGreeting], createdAt: Date.now() };
        setCurrentId(newConv.id);
        return [newConv];
      }
      if (id === currentId) setCurrentId(filtered[0].id);
      return filtered;
    });
  };

  const sendChat = async (text, newMessages) => {
    const apiMessages = newMessages
      .filter((m) => m.role === "user" || m.role === "assistant")
      .map((m) => ({ role: m.role, content: m.content }));

    const response = await fetch("/api/chat", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: apiMessages }),
    });

    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      if (data.usage) setUsage(data.usage);
      throw new Error(data.error || "Сервер катасы: " + response.status);
    }

    if (data.usage) setUsage(data.usage);
    updateMessages([...newMessages, { role: "assistant", content: data.reply }]);
  };

  const [speakingIndex, setSpeakingIndex] = useState(null);
  const [audioUrls, setAudioUrls] = useState({});
  // Учурда ойнотулуп жаткан Audio объектисин — тез алмаштырганда токтотуш үчүн — кармап турабыз
  const currentAudioRef = useRef(null);
  // Ар бир speakText чакырууга өзүнчө ID берип, эски (артта калган) fetch
  // жообу жаңы тандалган добушту басып кетпеши үчүн көзөмөлдөйбүз
  const speakRequestIdRef = useRef(0);
  // Азыр бир нерсе угулуп жатса, аны токтотот (тез алмаштыруу үчүн)
  const stopSpeaking = () => {
    if (currentAudioRef.current) {
      currentAudioRef.current.pause();
      currentAudioRef.current = null;
    }
    setSpeakingIndex(null);
  };
  const [copiedIndex, setCopiedIndex] = useState(null);
  const [voiceMenuIndex, setVoiceMenuIndex] = useState(null);
  const [lastVoiceKey, setLastVoiceKey] = useState("akyn_ayal");

  // Поэзия окуу үчүн тандалуучу образдар (сервердеги POEM_VOICES менен дал келет)
  const POEM_VOICE_OPTIONS = [
    { key: "akyn_ayal", label: "🎙️ Аял акын — жүрөктөн" },
    { key: "akyn_erkek", label: "🎙️ Эркек акын — салттуу" },
    { key: "adabiy_ayal", label: "📖 Аял диктор — адабий" },
    { key: "adabiy_erkek", label: "📖 Эркек диктор — адабий" },
    { key: "manaschi", label: "🔥 Манасчы — эпикалык" },
    { key: "jash_akyn", label: "✨ Жаш акын — эмоционалдуу" },
    { key: "teren_ayal", label: "🌙 Терең аял добушу — жылуу" },
    { key: "mekenchil_erkek", label: "🦅 Мекенчил эркек — курч" },
    { key: "eng_kuchtuu", label: "⚡ Эң күчтүү добуш — асман жарган" },
  ];

  // =====================================================================
  // --- "Обон" (өзүнчө таб) — Suno аркылуу вокалдуу ыр генерациялоо ---
  // =====================================================================
  // Тандалуучу тилдер/стилдер (сервердеги MUSIC_LANGUAGES менен дал келет).
  // Кыргыз тили биринчи жана негизги катары эмфаза берилет.
  const MUSIC_LANG_OPTIONS = [
    { key: "kyrgyz", label: "🇰🇬 Кыргызча", desc: "Комуз, кыл кыяк — эң күчтүү басым" },
    { key: "russian", label: "🇷🇺 Орусча", desc: "Балалайка, оркестр" },
    { key: "uzbek", label: "🇺🇿 Өзбекче", desc: "Дутар, дойра, макам" },
    { key: "kazakh", label: "🇰🇿 Казакча", desc: "Домбра, кобыз, дала обону" },
  ];

  const [musicLyrics, setMusicLyrics] = useState("");
  const [musicLang, setMusicLang] = useState("kyrgyz");
  const [musicCustomStyle, setMusicCustomStyle] = useState(""); // колдонуучунун өз каалаган стили/жанры (милдеттүү эмес)
  const [musicGenStatus, setMusicGenStatus] = useState(""); // "" | "generating" | "ready" | "error"
  const [musicGenUrl, setMusicGenUrl] = useState(null);
  const [musicGenTaskId, setMusicGenTaskId] = useState(null);
  const [musicProgress, setMusicProgress] = useState("");
  const musicPollRef = useRef(null);
  const musicAudioRef = useRef(null);
  const [musicPlaying, setMusicPlaying] = useState(false);

  const stopMusicPlayback = () => {
    if (musicAudioRef.current) {
      musicAudioRef.current.pause();
      musicAudioRef.current = null;
    }
    setMusicPlaying(false);
  };

  const toggleMusicPlayback = () => {
    if (!musicGenUrl) return;
    if (musicPlaying) {
      stopMusicPlayback();
      return;
    }
    stopSpeaking();
    const audio = new Audio(musicGenUrl);
    musicAudioRef.current = audio;
    audio.onended = () => setMusicPlaying(false);
    audio.onerror = () => setMusicPlaying(false);
    setMusicPlaying(true);
    audio.play().catch((err) => {
      setError("Ойнотуу катасы: " + err.message);
      setMusicPlaying(false);
    });
  };

  const pollMusicGenStatus = (taskId, attemptsLeft = 90) => {
    if (musicPollRef.current) clearTimeout(musicPollRef.current);
    musicPollRef.current = setTimeout(async () => {
      try {
        const response = await fetch(`/api/music-status/${encodeURIComponent(taskId)}`, { credentials: "include" });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "Обон статусу катасы");

        if (data.status === "done" && data.audioUrl) {
          setMusicGenUrl(data.audioUrl);
          setMusicGenStatus("ready");
          setMusicProgress("");
          return;
        }
        if (data.status === "error") {
          setMusicGenStatus("error");
          setMusicProgress("");
          setError("Обон катасы: " + (data.error || "белгисиз ката"));
          return;
        }
        if (attemptsLeft > 0) {
          setMusicProgress(`🎶 ыр жаралып жатат... (${60 - attemptsLeft + 1}-аракет)`);
          pollMusicGenStatus(taskId, attemptsLeft - 1);
        } else {
          setMusicGenStatus("error");
          setMusicProgress("");
          setError("Ыр түзүлүшү өтө узакка созулду, кайра аракет кылыңыз.");
        }
      } catch (err) {
        setMusicGenStatus("error");
        setMusicProgress("");
        setError("Обон статусун текшерүү катасы: " + err.message);
      }
    }, 5000);
  };

  const generateSongWithMusic = async () => {
    if (!musicLyrics.trim() || musicGenStatus === "generating") return;
    setError(null);
    setMusicGenUrl(null);
    setMusicGenTaskId(null);
    stopMusicPlayback();
    setMusicGenStatus("generating");
    setMusicProgress("🎼 обон стили жана сөздөр даярдалып жатат...");
    try {
      const response = await fetch("/api/generate-music", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: musicLyrics, lang: musicLang, customStyle: musicCustomStyle }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Обон катасы: " + response.status);
      if (data.usage) setUsage(data.usage);

      setMusicGenTaskId(data.taskId);
      setMusicProgress("🎶 ыр жаралып жатат... (1-2 мүнөт күтүңүз)");
      pollMusicGenStatus(data.taskId);
    } catch (err) {
      setMusicGenStatus("error");
      setMusicProgress("");
      setError("Обон ката: " + err.message);
    }
  };

  const copyToClipboard = async (text, index) => {
    try {
      await navigator.clipboard.writeText(text);
      setCopiedIndex(index);
      setTimeout(() => setCopiedIndex((prev) => (prev === index ? null : prev)), 1500);
    } catch (e) {
      // Кээ бир эски браузерлерде clipboard API иштебейт — запаска жол
      try {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        setCopiedIndex(index);
        setTimeout(() => setCopiedIndex((prev) => (prev === index ? null : prev)), 1500);
      } catch (e2) {
        setError("Копия кылуу мүмкүн болбоду");
      }
    }
  };

  // Gemini'ден келген чийки PCM'ди (16-bit, моно, 24kHz) чыныгы MP3 файлга
  // айландырат (lamejs энкодери менен), ошондуктан жүктөп алынган үн
  // бир бүтүн, стандарттуу .mp3 файл болот.
  function pcmToMp3Blob(base64Pcm, sampleRate = 24000) {
    const binary = atob(base64Pcm);
    const len = binary.length;
    const pcmBytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) pcmBytes[i] = binary.charCodeAt(i);
    const samples = new Int16Array(pcmBytes.buffer, pcmBytes.byteOffset, Math.floor(pcmBytes.length / 2));

    const mp3encoder = new lamejs.Mp3Encoder(1, sampleRate, 128);
    const mp3Chunks = [];
    const blockSize = 1152;

    for (let i = 0; i < samples.length; i += blockSize) {
      const chunk = samples.subarray(i, i + blockSize);
      const mp3buf = mp3encoder.encodeBuffer(chunk);
      if (mp3buf.length > 0) mp3Chunks.push(mp3buf);
    }
    const finalBuf = mp3encoder.flush();
    if (finalBuf.length > 0) mp3Chunks.push(finalBuf);

    return new Blob(mp3Chunks, { type: "audio/mp3" });
  }

  const speakText = async (text, index, voiceKey) => {
    // Мурунку добуш угулуп жатса — токтотуп, дароо жаңысын баштайбыз
    stopSpeaking();
    setVoiceMenuIndex(null);
    if (voiceKey) setLastVoiceKey(voiceKey);
    setSpeakingIndex(index);
    setError(null);
    const requestId = ++speakRequestIdRef.current;
    try {
      const response = await fetch("/api/speak", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, voiceKey: voiceKey || lastVoiceKey }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Үн катасы: " + response.status);

      // Ушул fetch жооп бергенче колдонуучу дагы башка добуш тандаган болушу
      // мүмкүн — андай учурда бул эски жоопту таштап коебуз
      if (requestId !== speakRequestIdRef.current) return;

      const blob = pcmToMp3Blob(data.audioBase64);
      const url = URL.createObjectURL(blob);
      setAudioUrls((prev) => ({ ...prev, [index]: url }));
      const audio = new Audio(url);
      currentAudioRef.current = audio;
      audio.onended = () => {
        if (currentAudioRef.current === audio) {
          currentAudioRef.current = null;
          setSpeakingIndex(null);
        }
      };
      audio.onerror = () => {
        if (currentAudioRef.current === audio) {
          currentAudioRef.current = null;
          setSpeakingIndex(null);
        }
      };
      await audio.play();
    } catch (err) {
      if (requestId === speakRequestIdRef.current) {
        setError("Үн ката: " + err.message);
        setSpeakingIndex(null);
      }
    }
  };

  const [fileLoading, setFileLoading] = useState(false);
  const fileInputRef = useRef(null);

  const handleFilePick = () => {
    if (fileInputRef.current) fileInputRef.current.click();
  };

  const handleFileChange = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;

    const allowedTypes = [
      "application/pdf",
      "image/jpeg",
      "image/png",
      "image/webp",
      "application/zip",
      "application/x-zip-compressed",
    ];
    const isZipExt = file.name.toLowerCase().endsWith(".zip");
    if (!allowedTypes.includes(file.type) && !isZipExt) {
      setError("Бул файл түрү колдоого алынбайт. PDF, сүрөт (jpg/png) же ZIP жиберсеңиз болот.");
      return;
    }
    if (file.size > 10 * 1024 * 1024) {
      setError("Файл өтө чоң (10МБ чегинен ашпасын).");
      return;
    }

    const userMsgText = `📎 Файл жиберди: ${file.name}`;
    const newMessages = [...messages, { role: "user", content: userMsgText }];
    updateMessages(newMessages);
    setFileLoading(true);
    setError(null);

    try {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const mimeType = file.type || (isZipExt ? "application/zip" : "application/octet-stream");

      const response = await fetch("/api/analyze-file", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ fileBase64: base64, mimeType, fileName: file.name }),
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        if (data.usage) setUsage(data.usage);
        throw new Error(data.error || "Сервер катасы: " + response.status);
      }
      if (data.usage) setUsage(data.usage);

      updateMessages([...newMessages, { role: "assistant", content: data.reply }]);
    } catch (err) {
      setError("Файл катасы: " + err.message);
    } finally {
      setFileLoading(false);
    }
  };

  const sendImage = async (prompt, newMessages) => {
    const response = await fetch("/api/image", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt }),
    });

    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      if (data.usage) setUsage(data.usage);
      throw new Error(data.error || "Сервер катасы: " + response.status);
    }

    if (data.usage) setUsage(data.usage);
    updateMessages([...newMessages, { role: "assistant", type: "image", content: data.dataUrl, caption: prompt }]);
  };

  function pickSupportedMimeType() {
    const candidates = [
      "video/mp4;codecs=h264",
      "video/mp4",
      "video/webm;codecs=vp9",
      "video/webm;codecs=vp8",
      "video/webm",
    ];
    for (const type of candidates) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) return type;
    }
    return null;
  }

  function extensionForMimeType(mimeType) {
    if (!mimeType) return "webm";
    if (mimeType.indexOf("mp4") !== -1) return "mp4";
    return "webm";
  }

  function wrapText(ctx, text, maxWidth) {
    const words = text.split(" ");
    const lines = [];
    let line = "";
    for (const w of words) {
      const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = w;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  const generateVideo = async (kind = "lyrics") => {
    if (kind === "lyrics" && !lyrics.trim()) {
      setError("Алгач ыр текстин жазыңыз.");
      return;
    }
    if (kind === "cartoon" && !cartoonStory.trim()) {
      setError("Алгач мультиктин окуясын (синопсисин) жазыңыз.");
      return;
    }

    setError(null);
    setVideoUrl(null);
    setVideoStage("scenes");
    setVideoProgress(
      kind === "cartoon"
        ? "Окуяны сахналарга бөлүп, мультик сүрөттөрүн тартып жатам..."
        : "Ырды сахналарга бөлүп, сүрөттөрдү тартып жатам..."
    );

    try {
      const endpoint = kind === "cartoon" ? "/api/cartoon-scenes" : "/api/video-scenes";
      const body = kind === "cartoon" ? { story: cartoonStory, characters: cartoonCharacters } : { lyrics };

      const response = await fetch(endpoint, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Сервер катасы: " + response.status);
      if (data.usage) setUsage(data.usage);

      const { scenes, secondsPerScene } = data;
      if (!scenes || scenes.length === 0) throw new Error("Сахна алынган жок");

      setVideoStage("rendering");
      setVideoProgress("Видеого чогултуп жатам...");

      const images = await Promise.all(
        scenes.map(
          (s) =>
            new Promise((resolve, reject) => {
              const img = new Image();
              img.onload = () => resolve(img);
              img.onerror = reject;
              img.src = s.imageDataUrl;
            })
        )
      );

      const canvas = canvasRef.current;
      canvas.width = 720;
      canvas.height = 1280;
      const ctx = canvas.getContext("2d");

      const mimeType = pickSupportedMimeType();
      if (!mimeType) throw new Error("Бул браузер видео жаза албайт");
      setVideoExt(extensionForMimeType(mimeType));

      const stream = canvas.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType });
      const chunks = [];
      recorder.ondataavailable = (e) => e.data.size > 0 && chunks.push(e.data);

      const done = new Promise((resolve) => {
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: mimeType });
          resolve(URL.createObjectURL(blob));
        };
      });

      recorder.start();

      for (let i = 0; i < images.length; i++) {
        setVideoProgress(`Сахна ${i + 1}/${images.length} тартылып жатат...`);
        const img = images[i];
        const line = scenes[i].lyricLine || "";
        const startTime = performance.now();
        const durationMs = secondsPerScene * 1000;

        while (performance.now() - startTime < durationMs) {
          const scale = Math.max(canvas.width / img.width, canvas.height / img.height);
          const w = img.width * scale;
          const h = img.height * scale;
          const x = (canvas.width - w) / 2;
          const y = (canvas.height - h) / 2;
          ctx.drawImage(img, x, y, w, h);

          ctx.font = "bold 40px sans-serif";
          const maxWidth = canvas.width - 80;
          const lines = wrapText(ctx, line, maxWidth);
          const lineHeight = 52;
          const boxHeight = lines.length * lineHeight + 40;
          const boxY = canvas.height - boxHeight - 60;

          ctx.fillStyle = "rgba(20, 23, 31, 0.72)";
          ctx.fillRect(0, boxY, canvas.width, boxHeight);

          ctx.fillStyle = "#F2EFE9";
          ctx.textAlign = "center";
          lines.forEach((ln, idx) => {
            ctx.fillText(ln, canvas.width / 2, boxY + 44 + idx * lineHeight);
          });

          await new Promise((r) => setTimeout(r, 1000 / 30));
        }
      }

      recorder.stop();
      const url = await done;
      setVideoUrl(url);
      setVideoStage("done");
      setVideoProgress("");
    } catch (err) {
      setError("Видео катасы: " + err.message);
      setVideoStage("");
      setVideoProgress("");
    }
  };

  // --- Акысыз HF моделинен алынган кыймылдуу видео-клиптерди бир видеого бириктирүү ---
  const generateCartoonRealVideo = async () => {
    if (!cartoonStory.trim()) {
      setError("Алгач мультиктин окуясын (синопсисин) жазыңыз.");
      return;
    }

    setError(null);
    setVideoUrl(null);
    setVideoStage("scenes");
    setVideoProgress("Кыймылдуу клиптерди жаратып жатам (бул бир аз убакыт алат)...");

    try {
      const response = await fetch("/api/cartoon-clips", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ story: cartoonStory, characters: cartoonCharacters }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Сервер катасы: " + response.status);
      if (data.usage) setUsage(data.usage);

      const { clips } = data;
      if (!clips || clips.length === 0) throw new Error("Клип алынган жок");

      setVideoStage("rendering");
      setVideoProgress("Клиптерди видеого чогултуп жатам...");

      const canvas = canvasRef.current;
      canvas.width = 720;
      canvas.height = 1280;
      const ctx = canvas.getContext("2d");

      const mimeType = pickSupportedMimeType();
      if (!mimeType) throw new Error("Бул браузер видео жаза албайт");
      setVideoExt(extensionForMimeType(mimeType));

      const stream = canvas.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType });
      const chunks = [];
      recorder.ondataavailable = (e) => e.data.size > 0 && chunks.push(e.data);

      const done = new Promise((resolve) => {
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: mimeType });
          resolve(URL.createObjectURL(blob));
        };
      });

      recorder.start();

      for (let i = 0; i < clips.length; i++) {
        setVideoProgress(`Клип ${i + 1}/${clips.length} ойнотулуп жатат...`);
        const clip = clips[i];
        const line = clip.lyricLine || "";

        await new Promise((resolveClip, rejectClip) => {
          const videoEl = document.createElement("video");
          videoEl.src = clip.videoDataUrl;
          videoEl.muted = true;
          videoEl.playsInline = true;

          let rafId = null;

          const drawFrame = () => {
            if (videoEl.paused || videoEl.ended) return;
            const scale = Math.max(canvas.width / videoEl.videoWidth, canvas.height / videoEl.videoHeight);
            const w = videoEl.videoWidth * scale;
            const h = videoEl.videoHeight * scale;
            const x = (canvas.width - w) / 2;
            const y = (canvas.height - h) / 2;
            ctx.drawImage(videoEl, x, y, w, h);

            ctx.font = "bold 40px sans-serif";
            const maxWidth = canvas.width - 80;
            const lines = wrapText(ctx, line, maxWidth);
            const lineHeight = 52;
            const boxHeight = lines.length * lineHeight + 40;
            const boxY = canvas.height - boxHeight - 60;

            ctx.fillStyle = "rgba(20, 23, 31, 0.72)";
            ctx.fillRect(0, boxY, canvas.width, boxHeight);
            ctx.fillStyle = "#F2EFE9";
            ctx.textAlign = "center";
            lines.forEach((ln, idx) => {
              ctx.fillText(ln, canvas.width / 2, boxY + 44 + idx * lineHeight);
            });

            rafId = requestAnimationFrame(drawFrame);
          };

          videoEl.onloadedmetadata = () => {
            videoEl.play().then(() => {
              rafId = requestAnimationFrame(drawFrame);
            }).catch(rejectClip);
          };
          videoEl.onended = () => {
            if (rafId) cancelAnimationFrame(rafId);
            resolveClip();
          };
          videoEl.onerror = () => {
            if (rafId) cancelAnimationFrame(rafId);
            resolveClip(); // катасы болсо да, кийинки клипке өтөбүз
          };
        });
      }

      recorder.stop();
      const url = await done;
      setVideoUrl(url);
      setVideoStage("done");
      setVideoProgress("");
    } catch (err) {
      setError("Мультик видео катасы: " + err.message);
      setVideoStage("");
      setVideoProgress("");
    }
  };

  const editImageInputRef = useRef(null);
  const [editImageLoading, setEditImageLoading] = useState(false);

  const handleEditImagePick = () => {
    if (editImageInputRef.current) editImageInputRef.current.click();
  };

  const handleEditImageChange = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;

    if (!file.type.startsWith("image/")) {
      setError("Сураныч, сүрөт файлын тандаңыз (jpg, png).");
      return;
    }
    if (file.size > 15 * 1024 * 1024) {
      setError("Сүрөт өтө чоң (15МБ чегинен ашпасын).");
      return;
    }

    const prompt = input.trim() || "Бул сүрөттү сулуулант, сапатын жогорулат";
    const newMessages = [...messages, { role: "user", content: `📸 Сүрөттү түзөтүү сурамы: ${prompt}` }];
    updateMessages(newMessages);
    setInput("");
    setEditImageLoading(true);
    setError(null);

    try {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const response = await fetch("/api/edit-image", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ imageBase64: base64, mimeType: file.type, prompt }),
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        if (data.usage) setUsage(data.usage);
        throw new Error(data.error || "Сервер катасы: " + response.status);
      }
      if (data.usage) setUsage(data.usage);

      updateMessages([...newMessages, { role: "assistant", type: "image", content: data.dataUrl, caption: prompt }]);
    } catch (err) {
      setError("Сүрөт түзөтүү катасы: " + err.message);
    } finally {
      setEditImageLoading(false);
    }
  };

  const sendMessage = async () => {
    const text = input.trim();
    if (!text || loading) return;

    const newMessages = [...messages, { role: "user", content: text }];
    updateMessages(newMessages);
    setInput("");
    setLoading(true);
    setError(null);

    try {
      if (mode === "image") {
        await sendImage(text, newMessages);
      } else {
        await sendChat(text, newMessages);
      }
    } catch (err) {
      setError("Ката кетти: " + err.message);
    } finally {
      setLoading(false);
    }
  };

  const handleKeyDown = (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  };

  return (
    <div style={{ display: "flex", height: "100vh", background: "#14171F", fontFamily: "'Manrope', system-ui, sans-serif", color: "#F2EFE9" }}>
      {sidebarOpen && (
        <div onClick={() => setSidebarOpen(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 40 }} />
      )}

      <div style={{ position: "fixed", top: 0, left: sidebarOpen ? 0 : "-280px", width: 260, height: "100%", background: "#171B27", borderRight: "1px solid #23283A", zIndex: 50, transition: "left 0.2s", display: "flex", flexDirection: "column", padding: 14 }}>
        <button onClick={startNewChat} style={{ background: "#C4402B", color: "#FBF3EC", border: "none", borderRadius: 10, padding: "11px 14px", fontSize: 14, fontWeight: 600, fontFamily: "inherit", cursor: "pointer", marginBottom: 14 }}>+ Жаңы сүйлөшүү</button>

        <div style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column", gap: 4 }}>
          {conversations.map((c) => (

              <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.title}</span>
              <span onClick={(e) => deleteConversation(c.id, e)} style={{ color: "#8A90A6", fontSize: 15, padding: "0 4px" }}>×</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{ display: "flex", flexDirection: "column", flex: 1, minWidth: 0 }}>
        <div style={{ borderBottom: "1px solid #23283A", background: "#171B27" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, padding: "16px 20px 12px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div onClick={() => setSidebarOpen(true)} style={{ cursor: "pointer", fontSize: 20, padding: "2px 6px" }}>☰</div>
              <TundukMark size={30} />
              <div>
                <div style={{ fontFamily: "'Unbounded', sans-serif", fontSize: 16, fontWeight: 700, letterSpacing: "0.01em" }}>ТУНДУК</div>
                <div style={{ fontSize: 11, color: "#8A90A6", marginTop: 2 }}>
                  {mode === "chat" ? "Интернетти издейт" : mode === "image" ? "Сүрөт тартат" : mode === "cartoon" ? "Мультик тартат" : mode === "music" ? "Обондуу ыр жаратат" : "Видео чогултат"}
                </div>
              </div>
            </div>

            <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
              <button onClick={() => setMode("chat")} style={{ background: mode === "chat" ? "#C4402B" : "transparent", color: mode === "chat" ? "#FBF3EC" : "#8A90A6", border: "1px solid " + (mode === "chat" ? "#C4402B" : "#2A2F42"), borderRadius: 9, padding: "6px 12px", fontSize: 12.5, fontWeight: 600, fontFamily: "inherit", cursor: "pointer" }}>💬 Чат</button>
              <button onClick={() => setMode("image")} style={{ background: mode === "image" ? "#C4402B" : "transparent", color: mode === "image" ? "#FBF3EC" : "#8A90A6", border: "1px solid " + (mode === "image" ? "#C4402B" : "#2A2F42"), borderRadius: 9, padding: "6px 12px", fontSize: 12.5, fontWeight: 600, fontFamily: "inherit", cursor: "pointer" }}>🎨 Сүрөт</button>
              <button onClick={() => setMode("video")} style={{ background: mode === "video" ? "#C4402B" : "transparent", color: mode === "video" ? "#FBF3EC" : "#8A90A6", border: "1px solid " + (mode === "video" ? "#C4402B" : "#2A2F42"), borderRadius: 9, padding: "6px 12px", fontSize: 12.5, fontWeight: 600, fontFamily: "inherit", cursor: "pointer" }}>🎬 Видео</button>
              <button onClick={() => setMode("cartoon")} style={{ background: mode === "cartoon" ? "#C4402B" : "transparent", color: mode === "cartoon" ? "#FBF3EC" : "#8A90A6", border: "1px solid " + (mode === "cartoon" ? "#C4402B" : "#2A2F42"), borderRadius: 9, padding: "6px 12px", fontSize: 12.5, fontWeight: 600, fontFamily: "inherit", cursor: "pointer" }}>🐺 Мультик</button>
              <button onClick={() => setMode("music")} style={{ background: mode === "music" ? "#C4402B" : "transparent", color: mode === "music" ? "#FBF3EC" : "#8A90A6", border: "1px solid " + (mode === "music" ? "#C4402B" : "#2A2F42"), borderRadius: 9, padding: "6px 12px", fontSize: 12.5, fontWeight: 600, fontFamily: "inherit", cursor: "pointer" }}>🎵 Обон</button>
            </div>
          </div>

          {storageWarning && (
            <div style={{ padding: "0 20px 10px", fontSize: 11.5, color: "#E8B84B" }}>

          {usage && (

              <div style={{ fontSize: 11, color: "#8A90A6" }}>
                {mode === "chat"

            <button onClick={() => generateVideo("lyrics")} disabled={videoStage === "scenes" || videoStage === "rendering" || !lyrics.trim()} style={{ background: videoStage === "scenes" || videoStage === "rendering" || !lyrics.trim() ? "#3A3F52" : "#C4402B", color: "#FBF3EC", border: "none", borderRadius: 12, padding: "12px 18px", fontSize: 14, fontWeight: 600, fontFamily: "inherit", cursor: videoStage === "scenes" || videoStage === "rendering" || !lyrics.trim() ? "default" : "pointer" }}>
              {videoStage ? "Иштеп жатам..." : "🎬 Видео жаса"}
            </button>

            {videoProgress && <div style={{ fontSize: 12.5, color: "#E8B84B" }}>{videoProgress}</div>}

            <canvas ref={canvasRef} style={{ display: "none" }} />

            {videoUrl && (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <video src={videoUrl} controls playsInline style={{ width: "100%", borderRadius: 12, background: "#000" }} />
                <a href={videoUrl} download={`tunduk-video.${videoExt}`} style={{ textAlign: "center", background: "#2A2F42", color: "#F2EFE9", padding: "10px", borderRadius: 10, fontSize: 13.5, textDecoration: "none" }}>⬇️ Видеону телефонго сактоо</a>
                <div style={{ fontSize: 11.5, color: "#8A90A6", textAlign: "center" }}>Барак жаңыртылса бул видео жоголот — азыр жүктөп алыңыз.</div>
              </div>

            {error && <div style={{ color: "#F2A0A0", fontSize: 13, background: "#2A1A1E", padding: "8px 14px", borderRadius: 10, border: "1px solid #4A2530" }}>{error}</div>}
          </div>
        ) : mode === "cartoon" ? (
          <div style={{ flex: 1, overflowY: "auto", padding: "24px 20px", display: "flex", flexDirection: "column", gap: 14 }}>
            <div style={{ fontSize: 13, color: "#8A90A6", lineHeight: 1.5 }}>

            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => setCartoonCharacters("wolf_hare")} style={{ flex: 1, background: cartoonCharacters === "wolf_hare" ? "#C4402B" : "#1E2230", color: cartoonCharacters === "wolf_hare" ? "#FBF3EC" : "#8A90A6", border: "1px solid " + (cartoonCharacters === "wolf_hare" ? "#C4402B" : "#2A2F42"), borderRadius: 10, padding: "10px 8px", fontSize: 13, fontWeight: 600, fontFamily: "inherit", cursor: "pointer" }}>🐺 Карышкыр менен коён</button>
              <button onClick={() => setCartoonCharacters("cat_mouse")} style={{ flex: 1, background: cartoonCharacters === "cat_mouse" ? "#C4402B" : "#1E2230", color: cartoonCharacters === "cat_mouse" ? "#FBF3EC" : "#8A90A6", border: "1px solid " + (cartoonCharacters === "cat_mouse" ? "#C4402B" : "#2A2F42"), borderRadius: 10, padding: "10px 8px", fontSize: 13, fontWeight: 600, fontFamily: "inherit", cursor: "pointer" }}>🐱 Мышык менен чычкан</button>
            </div>

            <textarea value={cartoonStory} onChange={(e) => setCartoonStory(e.target.value)} placeholder="Мисалы: Коён бакчадан сабиз уурдайт, карышкыр аны кармаганга аракет кылат, бирок ар дайым өзү тузакка түшөт..." rows={6} style={{ background: "#1E2230", border: "1px solid #2A2F42", borderRadius: 12, padding: "12px 14px", color: "#F2EFE9", fontSize: 14.5, fontFamily: "inherit", resize: "vertical" }} />

            <div onClick={() => setCartoonRealVideo((v) => !v)} style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer", background: "#1E2230", border: "1px solid #2A2F42", borderRadius: 10, padding: "10px 12px" }}>
              <div style={{ width: 36, height: 20, borderRadius: 10, background: cartoonRealVideo ? "#C4402B" : "#3A3F52", position: "relative", transition: "background 0.15s", flexShrink: 0 }}>
                <div style={{ width: 16, height: 16, borderRadius: "50%", background: "#FBF3EC", position: "absolute", top: 2, left: cartoonRealVideo ? 18 : 2, transition: "left 0.15s" }} />
              </div>
              <div style={{ fontSize: 12.5, color: "#C7CBDA", lineHeight: 1.4 }}>
                Чыныгы кыймылдуу видео (акысыз, эксперименталдык) — сапаты төмөн, кээде иштебей коюшу мүмкүн. Өчүрүлсө — сүрөт-слайдшоу колдонулат.
              </div>
            </div>

            <button onClick={() => (cartoonRealVideo ? generateCartoonRealVideo() : generateVideo("cartoon"))} disabled={videoStage === "scenes" || videoStage === "rendering" || !cartoonStory.trim()} style={{ background: videoStage === "scenes" || videoStage === "rendering" || !cartoonStory.trim() ? "#3A3F52" : "#C4402B", color: "#FBF3EC", border: "none", borderRadius: 12, padding: "12px 18px", fontSize: 14, fontWeight: 600, fontFamily: "inherit", cursor: videoStage === "scenes" || videoStage === "rendering" || !cartoonStory.trim() ? "default" : "pointer" }}>
              {videoStage ? "Иштеп жатам..." : "🐺 Мультик жаса"}

            <canvas ref={canvasRef} style={{ display: "none" }} />

            {videoUrl && (

              </div>
            )}

            {error && <div style={{ color: "#F2A0A0", fontSize: 13, background: "#2A1A1E", padding: "8px 14px", borderRadius: 10, border: "1px solid #4A2530" }}>{error}</div>}
          </div>
        ) : mode === "music" ? (
          <div style={{ flex: 1, overflowY: "auto", padding: "24px 20px", display: "flex", flexDirection: "column", gap: 14 }}>
            <div style={{ fontSize: 13, color: "#8A90A6", lineHeight: 1.5 }}>
              Ырдын же поэзиянын текстин жазыңыз — бот аны хит болгон ырчылардын ырларынан кем
              эмес, студиялык сапаттагы обонго айландырат: толук вокал жана музыка менен,
              куплеттер арасында музыкалык үзгүлтүк (инструментал брейк) менен. Каалаган жанрды
              өзүңүз жаза аласыз (рэп, рок, баллада ж.б.) — же бош калтырсаңыз, бот ырдын
              мазмунуна/маанайына карап эң ылайыктуу стилди өзү тандайт. Узундукка жана санга
              эч кандай чектөө жок.
            </div>

            <textarea value={musicLyrics} onChange={(e) => setMusicLyrics(e.target.value)} placeholder="Ырдын текстин (куплеттер, каалосо кайырма) ушул жерге жазыңыз..." rows={8} style={{ background: "#1E2230", border: "1px solid #2A2F42", borderRadius: 12, padding: "12px 14px", color: "#F2EFE9", fontSize: 14.5, fontFamily: "inherit", resize: "vertical" }} />

            <div>
              <div style={{ fontSize: 12, color: "#8A90A6", marginBottom: 8 }}>Тил жана обон стили:</div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                {MUSIC_LANG_OPTIONS.map((opt) => (
                  <button key={opt.key} onClick={() => setMusicLang(opt.key)} style={{ display: "flex", flexDirection: "column", alignItems: "flex-start", gap: 2, background: musicLang === opt.key ? "#C4402B" : "#1E2230", color: musicLang === opt.key ? "#FBF3EC" : "#C7CBDA", border: "1px solid " + (musicLang === opt.key ? "#C4402B" : "#2A2F42"), borderRadius: 10, padding: "9px 12px", fontSize: 13, fontWeight: 600, fontFamily: "inherit", cursor: "pointer", textAlign: "left" }}>
                    <span>{opt.label}</span>
                    <span style={{ fontSize: 10.5, fontWeight: 400, opacity: 0.85 }}>{opt.desc}</span>
                  </button>
                ))}
              </div>
            </div>

            <div>
              <div style={{ fontSize: 12, color: "#8A90A6", marginBottom: 6 }}>Каалаган обон/жанр (милдеттүү эмес):</div>
              <input
                type="text"
                value={musicCustomStyle}
                onChange={(e) => setMusicCustomStyle(e.target.value)}
                placeholder="Мис: рэп, рок, заманбап баллада, элек-дэнс... (бош калтырсаңыз — ырдын мазмунуна карап өзү тандайт)"
                style={{ width: "100%", background: "#1E2230", border: "1px solid #2A2F42", borderRadius: 10, padding: "10px 12px", color: "#F2EFE9", fontSize: 13.5, fontFamily: "inherit" }}
              />
            </div>

            <button onClick={generateSongWithMusic} disabled={musicGenStatus === "generating" || !musicLyrics.trim()} style={{ background: musicGenStatus === "generating" || !musicLyrics.trim() ? "#3A3F52" : "#C4402B", color: "#FBF3EC", border: "none", borderRadius: 12, padding: "12px 18px", fontSize: 14, fontWeight: 600, fontFamily: "inherit", cursor: musicGenStatus === "generating" || !musicLyrics.trim() ? "default" : "pointer" }}>
              {musicGenStatus === "generating" ? "Иштеп жатам..." : "🎵 Обондуу ыр жаса"}
            </button>

            {musicProgress && <div style={{ fontSize: 12.5, color: "#E8B84B" }}>{musicProgress}</div>}

            {musicGenUrl && (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <audio src={musicGenUrl} controls style={{ width: "100%" }} />
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={toggleMusicPlayback} style={{ flex: 1, background: "#2A2F42", color: "#F2EFE9", border: "none", borderRadius: 10, padding: "10px", fontSize: 13.5, fontFamily: "inherit", cursor: "pointer" }}>
                    {musicPlaying ? "⏹️ токтотуу" : "▶️ ойнотуу"}
                  </button>
                  <a href={musicGenUrl} download="tunduk-obon.mp3" style={{ flex: 1, textAlign: "center", background: "#2A2F42", color: "#F2EFE9", padding: "10px", borderRadius: 10, fontSize: 13.5, textDecoration: "none" }}>⬇️ сактоо</a>
                </div>
                <div style={{ fontSize: 11.5, color: "#8A90A6", textAlign: "center" }}>Барак жаңыртылса бул обон жоголушу мүмкүн — азыр жүктөп алыңыз.</div>
              </div>
            )}

            {error && <div style={{ color: "#F2A0A0", fontSize: 13, background: "#2A1A1E", padding: "8px 14px", borderRadius: 10, border: "1px solid #4A2530" }}>{error}</div>}
          </div>
        ) : (
          <>
            <div ref={scrollRef} style={{ flex: 1, overflowY: "auto", padding: "24px 16px", display: "flex", flexDirection: "column", gap: 14 }}>
              {messages.map((m, i) =>
                m.type === "image" ? (
                  <div key={i} style={{ alignSelf: "flex-start", maxWidth: "78%", display: "flex", flexDirection: "column", gap: 4 }}>
                    <div style={{ background: "#1E2230", borderRadius: "16px 16px 16px 4px", overflow: "hidden", boxShadow: "0 1px 2px rgba(0,0,0,0.2)" }}>
                      <img src={m.content} alt={m.caption} style={{ width: "100%", display: "block" }} />
                      <div style={{ padding: "8px 12px", fontSize: 12, color: "#8A90A6" }}>{m.caption}</div>
                    </div>
                    <button onClick={() => copyToClipboard(m.caption || "", i)} title="Сүрөттүн сыпаттамасын копия кылуу" style={{ alignSelf: "flex-start", background: "none", border: "none", color: copiedIndex === i ? "#E8B84B" : "#8A90A6", fontSize: 15, cursor: "pointer", padding: "2px 4px" }}>
                      {copiedIndex === i ? "✅ копия болду" : "📋 копия"}
                    </button>
                  </div>
                ) : (
                  <div key={i} style={{ alignSelf: m.role === "user" ? "flex-end" : "flex-start", maxWidth: "78%", display: "flex", flexDirection: "column", gap: 4 }}>
                    <div style={{ background: m.role === "user" ? "#C4402B" : "#1E2230", color: m.role === "user" ? "#FBF3EC" : "#F2EFE9", padding: "11px 15px", borderRadius: m.role === "user" ? "16px 16px 4px 16px" : "16px 16px 16px 4px", fontSize: 14.5, lineHeight: 1.5, whiteSpace: "pre-wrap", boxShadow: "0 1px 2px rgba(0,0,0,0.2)" }}>
                      {m.content}
                    </div>
                    <div style={{ display: "flex", gap: 12, alignSelf: m.role === "user" ? "flex-end" : "flex-start" }}>
                      <button onClick={() => copyToClipboard(m.content, i)} title="Копия кылуу" style={{ background: "none", border: "none", color: copiedIndex === i ? "#E8B84B" : "#8A90A6", fontSize: 15, cursor: "pointer", padding: "2px 4px" }}>
                        {copiedIndex === i ? "✅ копия болду" : "📋 копия"}
                      </button>
                      <button onClick={() => setVoiceMenuIndex((prev) => (prev === i ? null : i))} style={{ background: "none", border: "none", color: speakingIndex === i ? "#E8B84B" : "#8A90A6", fontSize: 15, cursor: "pointer", padding: "2px 4px" }}>
                        {speakingIndex === i ? "🔊 угулуп жатат..." : "🔈 угуу"}
                      </button>
                      {speakingIndex === i && (
                        <button onClick={stopSpeaking} title="Токтотуу" style={{ background: "none", border: "none", color: "#8A90A6", fontSize: 15, cursor: "pointer", padding: "2px 4px" }}>
                          ⏹️ токтотуу
                        </button>
                      )}
                      {audioUrls[i] && (
                        <a href={audioUrls[i]} download={`tunduk-audio-${i}.mp3`} style={{ background: "none", border: "none", color: "#8A90A6", fontSize: 15, cursor: "pointer", padding: "2px 4px", textDecoration: "none" }}>
                          ⬇️ жүктөп алуу
                        </a>
                      )}
                      <button onClick={() => { setMusicLyrics(m.content); setMode("music"); }} title="Бул текст менен обондуу ыр жасоо" style={{ background: "none", border: "none", color: "#8A90A6", fontSize: 15, cursor: "pointer", padding: "2px 4px" }}>
                        🎵 обон менен ырда
                      </button>
                    </div>
                    {voiceMenuIndex === i && (
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 2, maxWidth: 260 }}>
                        {POEM_VOICE_OPTIONS.map((v) => (
                          <button key={v.key} onClick={() => speakText(m.content, i, v.key)} style={{ background: "#1E2230", color: "#C7CBDA", border: "1px solid #2A2F42", borderRadius: 10, padding: "6px 10px", fontSize: 12, fontFamily: "inherit", cursor: "pointer" }}>
                            {v.label}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                )
              )}

              {loading && (
                <div style={{ alignSelf: "flex-start", background: "#1E2230", padding: "13px 18px", borderRadius: "16px 16px 16px 4px", display: "flex", gap: 5 }}>
                  <span className="dot" style={{ width: 6, height: 6, borderRadius: "50%", background: "#E8B84B", display: "inline-block" }} />
                  <span className="dot" style={{ width: 6, height: 6, borderRadius: "50%", background: "#E8B84B", display: "inline-block" }} />
                  <span className="dot" style={{ width: 6, height: 6, borderRadius: "50%", background: "#E8B84B", display: "inline-block" }} />
                </div>
              )}

              {error && <div style={{ alignSelf: "center", color: "#F2A0A0", fontSize: 13, background: "#2A1A1E", padding: "8px 14px", borderRadius: 10, border: "1px solid #4A2530" }}>{error}</div>}
            </div>

            <div style={{ padding: "14px 16px 18px", borderTop: "1px solid #23283A", background: "#171B27", display: "flex", gap: 10, alignItems: "flex-end" }}>
              <input ref={fileInputRef} type="file" accept=".pdf,.zip,image/jpeg,image/png,image/webp,application/pdf,application/zip,application/x-zip-compressed" onChange={handleFileChange} style={{ display: "none" }} />
              <input ref={editImageInputRef} type="file" accept="image/jpeg,image/png,image/webp" onChange={handleEditImageChange} style={{ display: "none" }} />
              {mode === "chat" && (
                <button onClick={handleFilePick} disabled={fileLoading || loading} title="Файл жүктөө (PDF, сүрөт, ZIP)" style={{ background: "#1E2230", color: "#8A90A6", border: "1px solid #2A2F42", borderRadius: 12, padding: "11px 13px", fontSize: 16, fontFamily: "inherit", cursor: fileLoading || loading ? "default" : "pointer", flexShrink: 0 }}>📎</button>
              )}
              {mode === "image" && (
                <button onClick={handleEditImagePick} disabled={editImageLoading} title="Сүрөт жүктөп түзөтүү" style={{ background: "#1E2230", color: "#8A90A6", border: "1px solid #2A2F42", borderRadius: 12, padding: "11px 13px", fontSize: 16, fontFamily: "inherit", cursor: editImageLoading ? "default" : "pointer", flexShrink: 0 }}>📸</button>
              )}
              <textarea value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={handleKeyDown} placeholder={mode === "image" ? "Кандай сүрөт тартылсын? (мис: асман, тоолор, күн батыш) же 📸 басып сүрөт жүктөп түзөтүңүз" : "Суроонузду кыргызча жазыңыз... (илим, тарых, тиричилик — баары)"} rows={1} style={{ flex: 1, resize: "none", background: "#1E2230", border: "1px solid #2A2F42", borderRadius: 12, padding: "11px 14px", color: "#F2EFE9", fontSize: 14.5, fontFamily: "inherit", maxHeight: 120 }} />
              <button onClick={sendMessage} disabled={loading || !input.trim()} style={{ background: loading || !input.trim() ? "#3A3F52" : "#C4402B", color: "#FBF3EC", border: "none", borderRadius: 12, padding: "12px 18px", fontSize: 14, fontWeight: 600, fontFamily: "inherit", cursor: loading || !input.trim() ? "default" : "pointer", transition: "background 0.15s" }}>Жиберүү</button>
            </div>
            {fileLoading && (
              <div style={{ padding: "0 16px 10px", fontSize: 12.5, color: "#E8B84B", background: "#171B27" }}>📎 Файл талданып жатат...</div>
            )}
            {editImageLoading && (
              <div style={{ padding: "0 16px 10px", fontSize: 12.5, color: "#E8B84B", background: "#171B27" }}>📸 Сүрөт түзөтүлүп жатат...</div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((err) => {
      console.error("Service worker катталган жок:", err);
    });
  });
}

</script>
</body>
</html>
