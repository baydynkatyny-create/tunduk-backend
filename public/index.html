<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Тундук — Кыргызча AI жардамчы</title>
<link rel="icon" type="image/png" href="./tunduk-logo.png" />
  <link rel="apple-touch-icon" href="./tunduk-logo.png" />
<link rel="manifest" href="./manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
<style>
  html, body, #root { margin: 0; padding: 0; height: 100%; background: #14171F; }
  * { box-sizing: border-box; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #2A2F42; border-radius: 8px; }
  textarea:focus, button:focus-visible { outline: 2px solid #E8B84B; outline-offset: 2px; }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  .dot { animation: pulse 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const TundukMark = ({ size = 28 }) => (
  <img src="./tunduk-logo.png" alt="Тундук" style={{ width: size, height: size, objectFit: "contain" }} />
);

function App() {
  const [conversations, setConversations] = useState(() => {
    try {
      const saved = localStorage.getItem("tunduk_conversations");
      if (saved) return JSON.parse(saved);
    } catch {}
    return [];
  });
  const [currentId, setCurrentId] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [mode, setMode] = useState("chat");
  const [lyrics, setLyrics] = useState("");
  const [videoStage, setVideoStage] = useState("");
  const [videoUrl, setVideoUrl] = useState(null);
  const [videoProgress, setVideoProgress] = useState("");
  const [videoExt, setVideoExt] = useState("webm");
  const canvasRef = useRef(null);
  const [usage, setUsage] = useState(null);
  const scrollRef = useRef(null);

  const [reminders, setReminders] = useState(() => {
    try {
      const saved = localStorage.getItem("tunduk_reminders");
      if (saved) return JSON.parse(saved);
    } catch {}
    return [];
  });
  const [reminderLabel, setReminderLabel] = useState("");
  const [reminderMinutes, setReminderMinutes] = useState("10");
  const [reminderAlarmTime, setReminderAlarmTime] = useState("07:00");
  const [reminderKind, setReminderKind] = useState("timer");
  const [reminderDays, setReminderDays] = useState([]);
  const audioCtxRef = useRef(null);

  useEffect(() => {
    try {
      localStorage.setItem("tunduk_reminders", JSON.stringify(reminders));
    } catch {}
  }, [reminders]);

  useEffect(() => {
    if (window.Notification && Notification.permission === "default") {
      Notification.requestPermission().catch(() => {});
    }
  }, []);

  const playBeep = () => {
    try {
      if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = audioCtxRef.current;
      for (let i = 0; i < 3; i++) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.001, ctx.currentTime + i * 0.5);
        gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + i * 0.5 + 0.02);
        gain.gain.linearRampToValueAtTime(0.001, ctx.currentTime + i * 0.5 + 0.4);
        osc.connect(gain).connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.5);
        osc.stop(ctx.currentTime + i * 0.5 + 0.45);
      }
    } catch {}
  };

  const fireReminder = (r) => {
    playBeep();
    if (window.Notification && Notification.permission === "granted") {
      try {
        new Notification("⏰ Тундук эскертүү", { body: r.label || "Убакыт келди!" });
      } catch {}
    }
    setError(null);
  };

  useEffect(() => {
    const interval = setInterval(() => {
      const now = Date.now();
      setReminders((prev) => {
        let changed = false;
        const next = prev.map((r) => {
          if (r.done || r.triggerAt > now) return r;
          changed = true;
          fireReminder(r);
          if (r.kind === "alarm" && r.days && r.days.length > 0) {
            const nextTrigger = nextAlarmTimestamp(r.hour, r.minute, r.days);
            return { ...r, triggerAt: nextTrigger };
          }
          return { ...r, done: true };
        });
        return changed ? next : prev;
      });
    }, 1000);
    return () => clearInterval(interval);
  }, []);

  function nextAlarmTimestamp(hour, minute, days) {
    const now = new Date();
    for (let add = 0; add < 8; add++) {
      const d = new Date(now);
      d.setDate(now.getDate() + add);
      d.setHours(hour, minute, 0, 0);
      const weekday = d.getDay() + 1;
      if (d.getTime() > now.getTime() && (days.length === 0 || days.includes(weekday))) {
        return d.getTime();
      }
    }
    const d = new Date(now);
    d.setDate(now.getDate() + 1);
    d.setHours(hour, minute, 0, 0);
    return d.getTime();
  }

  const addTimerReminder = () => {
    const mins = parseFloat(reminderMinutes);
    if (!mins || mins <= 0) {
      setError("Мүнөттөрдү туура киргизиңиз.");
      return;
    }
    const triggerAt = Date.now() + mins * 60 * 1000;
    setReminders((prev) => [
      ...prev,
      { id: Date.now().toString(), kind: "timer", label: reminderLabel.trim() || "Таймер", triggerAt, done: false },
    ]);
    setReminderLabel("");
    setError(null);
  };

  const addAlarmReminder = () => {
    const [hStr, mStr] = reminderAlarmTime.split(":");
    const hour = parseInt(hStr, 10);
    const minute = parseInt(mStr, 10);
    if (isNaN(hour) || isNaN(minute)) {
      setError("Убакытты туура киргизиңиз.");
      return;
    }
    const triggerAt = nextAlarmTimestamp(hour, minute, reminderDays);
    setReminders((prev) => [
      ...prev,
      {
        id: Date.now().toString(),
        kind: "alarm",
        label: reminderLabel.trim() || "Эскертүү",
        hour,
        minute,
        days: reminderDays,
        triggerAt,
        done: false,
      },
    ]);
    setReminderLabel("");
    setError(null);
  };

  const deleteReminder = (id) => setReminders((prev) => prev.filter((r) => r.id !== id));

  const toggleReminderDay = (day) => {
    setReminderDays((prev) => (prev.includes(day) ? prev.filter((d) => d !== day) : [...prev, day].sort()));
  };

  const dayLabels = ["Жк", "Дш", "Шш", "Шр", "Бш", "Жм", "Иш"];

  const downloadAsWord = (filename, title, bodyHtml) => {
    const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${title}</title></head><body>${bodyHtml}</body></html>`;
    const blob = new Blob(["\ufeff", html], { type: "application/msword" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  };

  const escapeHtml = (s) =>
    String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br/>");

  const downloadMessage = (content) => {
    downloadAsWord(
      "tunduk-jooп.doc",
      "Тундук жообу",
      `<p style="font-family:Arial;font-size:14px;">${escapeHtml(content)}</p>`
    );
  };

  const downloadConversation = () => {
    const body = messages
      .filter((m) => m.type !== "image")
      .map(
        (m) =>
          `<p style="font-family:Arial;font-size:14px;"><b>${m.role === "user" ? "Сиз" : "Тундук"}:</b><br/>${escapeHtml(m.content)}</p>`
      )
      .join("");
    downloadAsWord("tunduk-suylosuu.doc", "Тундук менен сүйлөшүү", body);
  };

  const defaultGreeting = { role: "assistant", content: "Салам! Мен — Тундук, сиздин кыргызча AI жардамчыңыз. Күнүмдүк суроолордон тартып, физика, биология, астрономия, тарых сыяктуу дүйнөлүк илимдердин темаларына чейин — эмне жөнүндө болсо да сурай бериңиз!" };

  useEffect(() => {
    if (conversations.length === 0) {
      const newConv = { id: Date.now().toString(), title: "Жаңы сүйлөшүү", messages: [defaultGreeting], createdAt: Date.now() };
      setConversations([newConv]);
      setCurrentId(newConv.id);
    } else if (!currentId) {
      setCurrentId(conversations[0].id);
    }
  }, []);

  const [storageWarning, setStorageWarning] = useState(false);

  useEffect(() => {
    if (conversations.length === 0) return;
    try {
      localStorage.setItem("tunduk_conversations", JSON.stringify(conversations));
      setStorageWarning(false);
    } catch (e) {
      try {
        const lightweight = conversations.map((c) => ({
          ...c,
          messages: c.messages.map((m) =>
            m.type === "image" ? { role: m.role, type: "image", content: "", caption: m.caption } : m
          ),
        }));
        localStorage.setItem("tunduk_conversations", JSON.stringify(lightweight));
        setStorageWarning(true);
      } catch (e2) {
        setStorageWarning(true);
      }
    }
  }, [conversations]);

  const currentConv = conversations.find((c) => c.id === currentId) || conversations[0];
  const messages = currentConv ? currentConv.messages : [defaultGreeting];

  useEffect(() => {
    scrollRef.current && scrollRef.current.scrollTo({ top: scrollRef.current.scrollHeight, behavior: "smooth" });
  }, [messages, loading]);

  const updateMessages = (newMessages) => {
    setConversations((prev) =>
      prev.map((c) => {
        if (c.id !== currentId) return c;
        let title = c.title;
        if (title === "Жаңы сүйлөшүү") {
          const firstUser = newMessages.find((m) => m.role === "user");
          if (firstUser) title = firstUser.content.slice(0, 34) + (firstUser.content.length > 34 ? "..." : "");
        }
        return { ...c, messages: newMessages, title };
      })
    );
  };

  const startNewChat = () => {
    const newConv = { id: Date.now().toString(), title: "Жаңы сүйлөшүү", messages: [defaultGreeting], createdAt: Date.now() };
    setConversations((prev) => [newConv, ...prev]);
    setCurrentId(newConv.id);
    setSidebarOpen(false);
    setError(null);
    setMode("chat");
  };

  const switchConversation = (id) => {
    setCurrentId(id);
    setSidebarOpen(false);
    setError(null);
  };

  const deleteConversation = (id, e) => {
    e.stopPropagation();
    setConversations((prev) => {
      const filtered = prev.filter((c) => c.id !== id);
      if (filtered.length === 0) {
        const newConv = { id: Date.now().toString(), title: "Жаңы сүйлөшүү", messages: [defaultGreeting], createdAt: Date.now() };
        setCurrentId(newConv.id);
        return [newConv];
      }
      if (id === currentId) setCurrentId(filtered[0].id);
      return filtered;
    });
  };

  const sendChat = async (text, newMessages) => {
    const apiMessages = newMessages
      .filter((m) => m.role === "user" || m.role === "assistant")
      .map((m) => ({ role: m.role, content: m.content }));

    const response = await fetch("/api/chat", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: apiMessages }),
    });

    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      if (data.usage) setUsage(data.usage);
      throw new Error(data.error || "Сервер катасы: " + response.status);
    }

    if (data.usage) setUsage(data.usage);
    updateMessages([...newMessages, { role: "assistant", content: data.reply }]);
  };

  const [speakingIndex, setSpeakingIndex] = useState(null);

  function pcmToWavBlob(base64Pcm, sampleRate = 24000) {
    const binary = atob(base64Pcm);
    const len = binary.length;
    const pcmBytes = new Uint8Array(len);
    for (let i = 0; i < len; i++) pcmBytes[i] = binary.charCodeAt(i);

    const numChannels = 1, bitsPerSample = 16;
    const byteRate = sampleRate * numChannels * bitsPerSample / 8;
    const blockAlign = numChannels * bitsPerSample / 8;
    const buffer = new ArrayBuffer(44 + pcmBytes.length);
    const view = new DataView(buffer);

    function writeStr(offset, str) {
      for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
    }

    writeStr(0, "RIFF");
    view.setUint32(4, 36 + pcmBytes.length, true);
    writeStr(8, "WAVE");
    writeStr(12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, numChannels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, byteRate, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, bitsPerSample, true);
    writeStr(36, "data");
    view.setUint32(40, pcmBytes.length, true);

    new Uint8Array(buffer, 44).set(pcmBytes);
    return new Blob([buffer], { type: "audio/wav" });
  }

  const speakText = async (text, index) => {
    if (speakingIndex !== null) return;
    setSpeakingIndex(index);
    setError(null);
    try {
      const response = await fetch("/api/speak", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Үн катасы: " + response.status);

      const blob = pcmToWavBlob(data.audioBase64);
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      audio.onended = () => setSpeakingIndex(null);
      audio.onerror = () => setSpeakingIndex(null);
      await audio.play();
    } catch (err) {
      setError("Үн ката: " + err.message);
      setSpeakingIndex(null);
    }
  };

  const [fileLoading, setFileLoading] = useState(false);
  const fileInputRef = useRef(null);

  const handleFilePick = () => {
    if (fileInputRef.current) fileInputRef.current.click();
  };

  const handleFileChange = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;

    const allowedTypes = [
      "application/pdf",
      "image/jpeg",
      "image/png",
      "image/webp",
      "application/zip",
      "application/x-zip-compressed",
    ];
    const isZipExt = file.name.toLowerCase().endsWith(".zip");
    if (!allowedTypes.includes(file.type) && !isZipExt) {
      setError("Бул файл түрү колдоого алынбайт. PDF, сүрөт (jpg/png) же ZIP жиберсеңиз болот.");
      return;
    }
    if (file.size > 15 * 1024 * 1024) {
      setError("Файл өтө чоң (15МБ чегинен ашпасын).");
      return;
    }

    const userMsgText = `📎 Файл жиберди: ${file.name}`;
    const newMessages = [...messages, { role: "user", content: userMsgText }];
    updateMessages(newMessages);
    setFileLoading(true);
    setError(null);

    try {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const mimeType = file.type || (isZipExt ? "application/zip" : "application/octet-stream");

      const response = await fetch("/api/analyze-file", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ fileBase64: base64, mimeType, fileName: file.name }),
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        if (data.usage) setUsage(data.usage);
        throw new Error(data.error || "Сервер катасы: " + response.status);
      }
      if (data.usage) setUsage(data.usage);

      updateMessages([...newMessages, { role: "assistant", content: data.reply }]);
    } catch (err) {
      setError("Файл катасы: " + err.message);
    } finally {
      setFileLoading(false);
    }
  };

  const sendImage = async (prompt, newMessages) => {
    const response = await fetch("/api/image", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt }),
    });

    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      if (data.usage) setUsage(data.usage);
      throw new Error(data.error || "Сервер катасы: " + response.status);
    }

    if (data.usage) setUsage(data.usage);
    updateMessages([...newMessages, { role: "assistant", type: "image", content: data.dataUrl, caption: prompt }]);
  };

  function pickSupportedMimeType() {
    const candidates = [
      "video/mp4;codecs=h264",
      "video/mp4",
      "video/webm;codecs=vp9",
      "video/webm;codecs=vp8",
      "video/webm",
    ];
    for (const type of candidates) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) return type;
    }
    return null;
  }

  function extensionForMimeType(mimeType) {
    if (!mimeType) return "webm";
    if (mimeType.indexOf("mp4") !== -1) return "mp4";
    return "webm";
  }

  function wrapText(ctx, text, maxWidth) {
    const words = text.split(" ");
    const lines = [];
    let line = "";
    for (const w of words) {
      const test = line ? line + " " + w : w;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = w;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  const generateVideo = async () => {
    if (!lyrics.trim()) {
      setError("Алгач ыр текстин жазыңыз.");
      return;
    }

    setError(null);
    setVideoUrl(null);
    setVideoStage("scenes");
    setVideoProgress("Ырды сахналарга бөлүп, сүрөттөрдү тартып жатам...");

    try {
      const response = await fetch("/api/video-scenes", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lyrics }),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || "Сервер катасы: " + response.status);
      if (data.usage) setUsage(data.usage);

      const { scenes, secondsPerScene } = data;
      if (!scenes || scenes.length === 0) throw new Error("Сахна алынган жок");

      setVideoStage("rendering");
      setVideoProgress("Видеого чогултуп жатам...");

      const images = await Promise.all(
        scenes.map(
          (s) =>
            new Promise((resolve, reject) => {
              const img = new Image();
              img.onload = () => resolve(img);
              img.onerror = reject;
              img.src = s.imageDataUrl;
            })
        )
      );

      const canvas = canvasRef.current;
      canvas.width = 720;
      canvas.height = 1280;
      const ctx = canvas.getContext("2d");

      const mimeType = pickSupportedMimeType();
      if (!mimeType) throw new Error("Бул браузер видео жаза албайт");
      setVideoExt(extensionForMimeType(mimeType));

      const stream = canvas.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType });
      const chunks = [];
      recorder.ondataavailable = (e) => e.data.size > 0 && chunks.push(e.data);

      const done = new Promise((resolve) => {
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: mimeType });
          resolve(URL.createObjectURL(blob));
        };
      });

      recorder.start();

      for (let i = 0; i < images.length; i++) {
        setVideoProgress(`Сахна ${i + 1}/${images.length} тартылып жатат...`);
        const img = images[i];
        const line = scenes[i].lyricLine || "";
        const startTime = performance.now();
        const durationMs = secondsPerScene * 1000;

        while (performance.now() - startTime < durationMs) {
          const scale = Math.max(canvas.width / img.width, canvas.height / img.height);
          const w = img.width * scale;
          const h = img.height * scale;
          const x = (canvas.width - w) / 2;
          const y = (canvas.height - h) / 2;
          ctx.drawImage(img, x, y, w, h);

          ctx.font = "bold 40px sans-serif";
          const maxWidth = canvas.width - 80;
          const lines = wrapText(ctx, line, maxWidth);
          const lineHeight = 52;
          const boxHeight = lines.length * lineHeight + 40;
          const boxY = canvas.height - boxHeight - 60;

          ctx.fillStyle = "rgba(20, 23, 31, 0.72)";
          ctx.fillRect(0, boxY, canvas.width, boxHeight);

          ctx.fillStyle = "#F2EFE9";
          ctx.textAlign = "center";
          lines.forEach((ln, idx) => {
            ctx.fillText(ln, canvas.width / 2, boxY + 44 + idx * lineHeight);
          });

          await new Promise((r) => setTimeout(r, 1000 / 30));
        }
      }

      recorder.stop();
      const url = await done;
      setVideoUrl(url);
      setVideoStage("done");
      setVideoProgress("");
    } catch (err) {
      setError("Видео катасы: " + err.message);
      setVideoStage("");
      setVideoProgress("");
    }
  };

  const editImageInputRef = useRef(null);
  const [editImageLoading, setEditImageLoading] = useState(false);

  const handleEditImagePick = () => {
    if (editImageInputRef.current) editImageInputRef.current.click();
  };

  const handleEditImageChange = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;

    if (!file.type.startsWith("image/")) {
      setError("Сураныч, сүрөт файлын тандаңыз (jpg, png).");
      return;
    }
    if (file.size > 15 * 1024 * 1024) {
      setError("Сүрөт өтө чоң (15МБ чегинен ашпасын).");
      return;
    }

    const prompt = input.trim() || "Бул сүрөттү сулуулант, сапатын жогорулат";
    const newMessages = [...messages, { role: "user", content: `📸 Сүрөттү түзөтүү сурамы: ${prompt}` }];
    updateMessages(newMessages);
    setInput("");
    setEditImageLoading(true);
    setError(null);

    try {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(",")[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const response = await fetch("/api/edit-image", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ imageBase64: base64, mimeType: file.type, prompt }),
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        if (data.usage) setUsage(data.usage);
        throw new Error(data.error || "Сервер катасы: " + response.status);
      }
      if (data.usage) setUsage(data.usage);

      updateMessages([...newMessages, { role: "assistant", type: "image", content: data.dataUrl, caption: prompt }]);
    } catch (err) {
      setError("Сүрөт түзөтүү катасы: " + err.message);
    } finally {
      setEditImageLoading(false);
    }
  };

  const sendMessage = async () => {
    const text = input.trim();
    if (!text || loading) return;

    const newMessages = [...messages, { role: "user", content: text }];
    updateMessages(newMessages);
    setInput("");
    setLoading(true);
    setError(null);

    try {
      if (mode === "image") {
        await sendImage(text, newMessages);
      } else {
        await sendChat(text, newMessages);
      }
    } catch (err) {
      setError("Ката кетти: " + err.message);
    } finally {
      setLoading(false);
    }
  };

  const handleKeyDown = (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  };

  return (
    <div style={{ display: "flex", height: "100vh", background: "#14171F", fontFamily: "'Manrope', system-ui, sans-serif", color: "#F2EFE9" }}>
      {sidebarOpen && (
        <div onClick={() => setSidebarOpen(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", zIndex: 40 }} />
      )}

      <div style={{ position: "fixed", top: 0, left: sidebarOpen ? 0 : "-280px", width: 260, height: "100%", background: "#171B27", borderRight: "1px solid #23283A", zIndex: 50, transition: "left 0.2s", display: "flex", flexDirection: "column", padding: 14 }}>
        <button onClick={startNewChat} style={{ background: "#C4402B", color: "#FBF3EC", border: "none", borderRadius: 10, padding: "11px 14px", fontSize: 14, fontWeight: 600, fontFamily: "inherit", cursor: "pointer", marginBottom: 14 }}>+ Жаңы сүйлөшүү</button>

        <div style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column", gap: 4 }}>
          {conversations.map((c) => (
            <div key={c.id} onClick={() => switchConversation(c.id)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, padding: "10px 12px", borderRadius: 9, background: c.id === currentId ? "#2A2F42" : "transparent", cursor: "pointer", fontSize: 13 }}>
              <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.title}</span>
              <span onClick={(e) => deleteConversation(c.id, e)} style={{ color: "#8A90A6", fontSize: 15, padding: "0 4px" }}>×</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{ display: "flex", flexDirection: "column", flex: 1, minWidth: 0 }}>
        <div style={{ borderBottom: "1px solid #23283A", background: "#171B27" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, padding: "16px 20px 12px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div onClick={() => setSidebarOpen(true)} style={{ cursor: "pointer", fontSize: 20, padding: "2px 6px" }}>☰</div>
              <TundukMark size={30} />
              <div>
                <div style={{ fontFamily: "'Unbounded', sans-serif", fontSize: 16, fontWeight: 700, letterSpacing: "0.01em" }}>ТУНДУК</div>
                <div style={{ fontSize: 11, color: "#8A90A6", marginTop: 2 }}>
                  {mode === "chat" ? "Интернетти издейт" : mode === "image" ? "Сүрөт тартат" : mode === "video" ? "Видео чогултат" : "Эскертүү коёт"}
                </div>
              </div>
            </div>

            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", justifyContent: "flex-end" }}>
              <button onClick={() => setMode("chat")} style={{ background: mode === "chat" ? "#C4402B" : "transparent", color: mode === "chat" ? "#FBF3EC" : "#8A90A6", border: "1px solid " + (mode === "chat" ? "#C4402B" : "#2A2F42"), borderRadius: 9, padding: "6px 12px", fontSize: 12.5, fontWeight: 600, fontFamily: "inherit", cursor: "pointer" }}>💬 Чат</button>
              <button onClick={() => setMode("image")} style={{ background: mode === "image" ? "#C4402B" : "transparent", color: mode === "image" ? "#FBF3EC" : "#8A90A6", border: "1px solid " + (mode === "image" ? "#C4402B" : "#2A2F42"), borderRadius: 9, padding: "6px 12px", fontSize: 12.5, fontWeight: 600, fontFamily: "inherit", cursor: "pointer" }}>🎨 Сүрөт</button>
              <button onClick={() => setMode("video")} style={{ background: mode === "video" ? "#C4402B" : "transparent", color: mode === "video" ? "#FBF3EC" : "#8A90A6", border: "1px solid " + (mode === "video" ? "#C4402B" : "#2A2F42"), borderRadius: 9, padding: "6px 12px", fontSize: 12.5, fontWeight: 600, fontFamily: "inherit", cursor: "pointer" }}>🎬 Видео</button>
              <button onClick={() => setMode("reminder")} style={{ background: mode === "reminder" ? "#C4402B" : "transparent", color: mode === "reminder" ? "#FBF3EC" : "#8A90A6", border: "1px solid " + (mode === "reminder" ? "#C4402B" : "#2A2F42"), borderRadius: 9, padding: "6px 12px", fontSize: 12.5, fontWeight: 600, fontFamily: "inherit", cursor: "pointer" }}>⏰ Эскертүү</button>
            </div>
          </div>

          {storageWarning && (
            <div style={{ padding: "0 20px 10px", fontSize: 11.5, color: "#E8B84B" }}>
              ⚠️ Байланыш эсинде орун жетишсиз — эски сүрөттөр сакталбай калышы мүмкүн.
            </div>
          )}

          {mode === "chat" && messages.some((m) => m.role === "assistant" && m.type !== "image") && (
            <div style={{ padding: "0 20px 10px", display: "flex", justifyContent: "flex-end" }}>
              <button onClick={downloadConversation} style={{ background: "none", border: "1px solid #2A2F42", color: "#8A90A6", borderRadius: 8, padding: "5px 10px", fontSize: 11.5, fontFamily: "inherit", cursor: "pointer" }}>📄 Сүйлөшүүнү Word кылып сактоо</button>
            </div>
          )}

          {usage && (
            <div style={{ padding: "0 20px 12px", display: "flex", justifyContent: "flex-end" }}>
              <div style={{ fontSize: 11, color: "#8A90A6" }}>
                {mode === "chat"
                  ? `Чат: ${usage.used ?? (usage.chat && usage.chat.used) ?? 0}/${usage.limit ?? (usage.chat && usage.chat.limit) ?? "?"}`
                  : mode === "video"
                  ? `Видео: ${(usage.video && usage.video.used) ?? usage.used ?? 0}/${(usage.video && usage.video.limit) ?? usage.limit ?? "?"}`
                  : `Сүрөт: ${(usage.images && usage.images.used) ?? usage.used ?? 0}/${(usage.images && usage.images.limit) ?? usage.limit ?? "?"}`}
              </div>
            </div>
          )}
        </div>

        {mode === "reminder" ? (
          <div style={{ flex: 1, overflowY: "auto", padding: "24px 20px", display: "flex", flexDirection: "column", gap: 16 }}>
            <div style={{ fontSize: 13, color: "#8A90A6", lineHeight: 1.5 }}>
              Таймер же күнүмдүк эскертүү (мис: дары ичүү, ойгонуу) коюңуз. Барак ачык турганда добуш жана билдирүү менен эскертет.
            </div>

            <div style={{ display: "flex", gap: 6 }}>
              <button onClick={() => setReminderKind("timer")} style={{ flex: 1, background: reminderKind === "timer" ? "#C4402B" : "#1E2230", color: reminderKind === "timer" ? "#FBF3EC" : "#8A90A6", border: "1px solid " + (reminderKind === "timer" ? "#C4402B" : "#2A2F42"), borderRadius: 10, padding: "10px", fontSize: 13, fontWeight: 600, fontFamily: "inherit", cursor: "pointer" }}>⏱️ Таймер</button>
              <button onClick={() => setReminderKind("alarm")} style={{ flex: 1, background: reminderKind === "alarm" ? "#C4402B" : "#1E2230", color: reminderKind === "alarm" ? "#FBF3EC" : "#8A90A6", border: "1px solid " + (reminderKind === "alarm" ? "#C4402B" : "#2A2F42"), borderRadius: 10, padding: "10px", fontSize: 13, fontWeight: 600, fontFamily: "inherit", cursor: "pointer" }}>⏰ Эскертүү</button>
            </div>

            <input value={reminderLabel} onChange={(e) => setReminderLabel(e.target.value)} placeholder="Эмне жөнүндө? (мис: Дары ичүү)" style={{ background: "#1E2230", border: "1px solid #2A2F42", borderRadius: 12, padding: "11px 14px", color: "#F2EFE9", fontSize: 14, fontFamily: "inherit" }} />

            {reminderKind === "timer" ? (
              <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                <input type="number" min="1" value={reminderMinutes} onChange={(e) => setReminderMinutes(e.target.value)} style={{ width: 90, background: "#1E2230", border: "1px solid #2A2F42", borderRadius: 12, padding: "11px 14px", color: "#F2EFE9", fontSize: 14, fontFamily: "inherit" }} />
                <span style={{ fontSize: 13, color: "#8A90A6" }}>мүнөттөн кийин</span>
              </div>
            ) : (
              <>
                <input type="time" value={reminderAlarmTime} onChange={(e) => setReminderAlarmTime(e.target.value)} style={{ background: "#1E2230", border: "1px solid #2A2F42", borderRadius: 12, padding: "11px 14px", color: "#F2EFE9", fontSize: 14, fontFamily: "inherit" }} />
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                  {dayLabels.map((d, idx) => (
                    <button key={idx} onClick={() => toggleReminderDay(idx + 1)} style={{ width: 36, height: 36, borderRadius: "50%", background: reminderDays.includes(idx + 1) ? "#C4402B" : "#1E2230", color: reminderDays.includes(idx + 1) ? "#FBF3EC" : "#8A90A6", border: "1px solid " + (reminderDays.includes(idx + 1) ? "#C4402B" : "#2A2F42"), fontSize: 12, fontFamily: "inherit", cursor: "pointer" }}>{d}</button>
                  ))}
                </div>
                <div style={{ fontSize: 11.5, color: "#8A90A6" }}>Күн тандалбаса — бир жолу гана эртеңки ушул убакытта эскертет.</div>
              </>
            )}

            <button onClick={reminderKind === "timer" ? addTimerReminder : addAlarmReminder} style={{ background: "#C4402B", color: "#FBF3EC", border: "none", borderRadius: 12, padding: "12px 18px", fontSize: 14, fontWeight: 600, fontFamily: "inherit", cursor: "pointer" }}>
              + Кошуу
            </button>

            {error && <div style={{ color: "#F2A0A0", fontSize: 13, background: "#2A1A1E", padding: "8px 14px", borderRadius: 10, border: "1px solid #4A2530" }}>{error}</div>}

            <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 8 }}>
              {reminders.length === 0 && <div style={{ fontSize: 13, color: "#8A90A6" }}>Азырынча эскертүү жок.</div>}
              {reminders.filter((r) => !r.done || (r.kind === "alarm" && r.days && r.days.length > 0)).map((r) => (
                <div key={r.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#1E2230", borderRadius: 12, padding: "12px 14px" }}>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 600 }}>{r.kind === "timer" ? "⏱️" : "⏰"} {r.label}</div>
                    <div style={{ fontSize: 12, color: "#8A90A6", marginTop: 2 }}>
                      {r.kind === "alarm"
                        ? `${String(r.hour).padStart(2, "0")}:${String(r.minute).padStart(2, "0")}` + (r.days && r.days.length ? " · " + r.days.map((d) => dayLabels[d - 1]).join(", ") : " · бир жолу")
                        : new Date(r.triggerAt).toLocaleTimeString("ky-KG", { hour: "2-digit", minute: "2-digit" })}
                    </div>
                  </div>
                  <button onClick={() => deleteReminder(r.id)} style={{ background: "none", border: "none", color: "#8A90A6", fontSize: 18, cursor: "pointer", padding: "4px 8px" }}>×</button>
                </div>
              ))}
            </div>
          </div>
        ) : mode === "video" ? (
          <div style={{ flex: 1, overflowY: "auto", padding: "24px 20px", display: "flex", flexDirection: "column", gap: 14 }}>
            <div style={{ fontSize: 13, color: "#8A90A6", lineHeight: 1.5 }}>
              Ыр текстин жазыңыз — бот аны 6 сахнага бөлүп, ар бирине сүрөт тартып, жок дегенде 3 мүнөттүк слайдшоу-видео чогултат (телефонго жүктөп алса болот).
            </div>

            <textarea value={lyrics} onChange={(e) => setLyrics(e.target.value)} placeholder="Ырдын текстин ушул жерге жазыңыз..." rows={6} style={{ background: "#1E2230", border: "1px solid #2A2F42", borderRadius: 12, padding: "12px 14px", color: "#F2EFE9", fontSize: 14.5, fontFamily: "inherit", resize: "vertical" }} />

            <button onClick={generateVideo} disabled={videoStage === "scenes" || videoStage === "rendering" || !lyrics.trim()} style={{ background: videoStage === "scenes" || videoStage === "rendering" || !lyrics.trim() ? "#3A3F52" : "#C4402B", color: "#FBF3EC", border: "none", borderRadius: 12, padding: "12px 18px", fontSize: 14, fontWeight: 600, fontFamily: "inherit", cursor: videoStage === "scenes" || videoStage === "rendering" || !lyrics.trim() ? "default" : "pointer" }}>
              {videoStage ? "Иштеп жатам..." : "🎬 Видео жаса"}
            </button>

            {videoProgress && <div style={{ fontSize: 12.5, color: "#E8B84B" }}>{videoProgress}</div>}

            <canvas ref={canvasRef} style={{ display: "none" }} />

            {videoUrl && (
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <video src={videoUrl} controls playsInline style={{ width: "100%", borderRadius: 12, background: "#000" }} />
                <a href={videoUrl} download={`tunduk-video.${videoExt}`} style={{ textAlign: "center", background: "#2A2F42", color: "#F2EFE9", padding: "10px", borderRadius: 10, fontSize: 13.5, textDecoration: "none" }}>⬇️ Видеону телефонго сактоо</a>
                <div style={{ fontSize: 11.5, color: "#8A90A6", textAlign: "center" }}>Барак жаңыртылса бул видео жоголот — азыр жүктөп алыңыз.</div>
              </div>
            )}

            {error && <div style={{ color: "#F2A0A0", fontSize: 13, background: "#2A1A1E", padding: "8px 14px", borderRadius: 10, border: "1px solid #4A2530" }}>{error}</div>}
          </div>
        ) : (
          <>
            <div ref={scrollRef} style={{ flex: 1, overflowY: "auto", padding: "24px 16px", display: "flex", flexDirection: "column", gap: 14 }}>
              {messages.map((m, i) =>
                m.type === "image" ? (
                  <div key={i} style={{ alignSelf: "flex-start", maxWidth: "78%", background: "#1E2230", borderRadius: "16px 16px 16px 4px", overflow: "hidden", boxShadow: "0 1px 2px rgba(0,0,0,0.2)" }}>
                    <img src={m.content} alt={m.caption} style={{ width: "100%", display: "block" }} />
                    <div style={{ padding: "8px 12px", fontSize: 12, color: "#8A90A6" }}>{m.caption}</div>
                  </div>
                ) : (
                  <div key={i} style={{ alignSelf: m.role === "user" ? "flex-end" : "flex-start", maxWidth: "78%", display: "flex", flexDirection: "column", gap: 4 }}>
                    <div style={{ background: m.role === "user" ? "#C4402B" : "#1E2230", color: m.role === "user" ? "#FBF3EC" : "#F2EFE9", padding: "11px 15px", borderRadius: m.role === "user" ? "16px 16px 4px 16px" : "16px 16px 16px 4px", fontSize: 14.5, lineHeight: 1.5, whiteSpace: "pre-wrap", boxShadow: "0 1px 2px rgba(0,0,0,0.2)" }}>
                      {m.content}
                    </div>
                    {m.role === "assistant" && (
                      <div style={{ display: "flex", gap: 10, alignSelf: "flex-start" }}>
                        <button onClick={() => speakText(m.content, i)} disabled={speakingIndex !== null} style={{ background: "none", border: "none", color: speakingIndex === i ? "#E8B84B" : "#8A90A6", fontSize: 15, cursor: speakingIndex !== null ? "default" : "pointer", padding: "2px 4px" }}>
                          {speakingIndex === i ? "🔊 угулуп жатат..." : "🔈 угуу"}
                        </button>
                        <button onClick={() => downloadMessage(m.content)} title="Word файл кылып сактоо" style={{ background: "none", border: "none", color: "#8A90A6", fontSize: 15, cursor: "pointer", padding: "2px 4px" }}>
                          📄 сактоо
                        </button>
                      </div>
                    )}
                  </div>
                )
              )}

              {loading && (
                <div style={{ alignSelf: "flex-start", background: "#1E2230", padding: "13px 18px", borderRadius: "16px 16px 16px 4px", display: "flex", gap: 5 }}>
                  <span className="dot" style={{ width: 6, height: 6, borderRadius: "50%", background: "#E8B84B", display: "inline-block" }} />
                  <span className="dot" style={{ width: 6, height: 6, borderRadius: "50%", background: "#E8B84B", display: "inline-block" }} />
                  <span className="dot" style={{ width: 6, height: 6, borderRadius: "50%", background: "#E8B84B", display: "inline-block" }} />
                </div>
              )}

              {error && <div style={{ alignSelf: "center", color: "#F2A0A0", fontSize: 13, background: "#2A1A1E", padding: "8px 14px", borderRadius: 10, border: "1px solid #4A2530" }}>{error}</div>}
            </div>

            <div style={{ padding: "14px 16px 18px", borderTop: "1px solid #23283A", background: "#171B27", display: "flex", gap: 10, alignItems: "flex-end" }}>
              <input ref={fileInputRef} type="file" accept=".pdf,.zip,image/jpeg,image/png,image/webp,application/pdf,application/zip,application/x-zip-compressed" onChange={handleFileChange} style={{ display: "none" }} />
              <input ref={editImageInputRef} type="file" accept="image/jpeg,image/png,image/webp" onChange={handleEditImageChange} style={{ display: "none" }} />
              {mode === "chat" && (
                <button onClick={handleFilePick} disabled={fileLoading || loading} title="Файл жүктөө (PDF, сүрөт, ZIP)" style={{ background: "#1E2230", color: "#8A90A6", border: "1px solid #2A2F42", borderRadius: 12, padding: "11px 13px", fontSize: 16, fontFamily: "inherit", cursor: fileLoading || loading ? "default" : "pointer", flexShrink: 0 }}>📎</button>
              )}
              {mode === "image" && (
                <button onClick={handleEditImagePick} disabled={editImageLoading} title="Сүрөт жүктөп түзөтүү" style={{ background: "#1E2230", color: "#8A90A6", border: "1px solid #2A2F42", borderRadius: 12, padding: "11px 13px", fontSize: 16, fontFamily: "inherit", cursor: editImageLoading ? "default" : "pointer", flexShrink: 0 }}>📸</button>
              )}
              <textarea value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={handleKeyDown} placeholder={mode === "image" ? "Кандай сүрөт тартылсын? (мис: асман, тоолор, күн батыш) же 📸 басып сүрөт жүктөп түзөтүңүз" : "Суроонузду кыргызча жазыңыз... (илим, тарых, тиричилик — баары)"} rows={1} style={{ flex: 1, resize: "none", background: "#1E2230", border: "1px solid #2A2F42", borderRadius: 12, padding: "11px 14px", color: "#F2EFE9", fontSize: 14.5, fontFamily: "inherit", maxHeight: 120 }} />
              <button onClick={sendMessage} disabled={loading || !input.trim()} style={{ background: loading || !input.trim() ? "#3A3F52" : "#C4402B", color: "#FBF3EC", border: "none", borderRadius: 12, padding: "12px 18px", fontSize: 14, fontWeight: 600, fontFamily: "inherit", cursor: loading || !input.trim() ? "default" : "pointer", transition: "background 0.15s" }}>Жиберүү</button>
            </div>
            {fileLoading && (
              <div style={{ padding: "0 16px 10px", fontSize: 12.5, color: "#E8B84B", background: "#171B27" }}>📎 Файл талданып жатат...</div>
            )}
            {editImageLoading && (
              <div style={{ padding: "0 16px 10px", fontSize: 12.5, color: "#E8B84B", background: "#171B27" }}>📸 Сүрөт түзөтүлүп жатат...</div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
