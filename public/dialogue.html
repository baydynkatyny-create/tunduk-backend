<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диалог добушу — Тундук</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #10142450;
    --night: #0F1322;
    --panel: #171C30;
    --panel-2: #1E2440;
    --line: #2B3252;
    --gold: #CBA135;
    --gold-soft: #E4C766;
    --ember: #B8433E;
    --ink: #ECE7D9;
    --ink-dim: #9BA0BC;
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--night);
    color: var(--ink);
    font-family: 'Golos Text', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background-image:
      radial-gradient(circle at 50% -10%, #2A3159 0%, transparent 45%),
      var(--night);
    min-height: 100vh;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  /* --- Тундук: сигнатуралык радиалдык тор мотиви --- */
  .tunduk {
    width: 92px;
    height: 92px;
    margin: 0 auto 22px;
    position: relative;
  }
  .tunduk svg { width: 100%; height: 100%; display: block; }
  .tunduk .ring {
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.4;
    opacity: 0.9;
  }
  .tunduk .spoke {
    stroke: var(--gold-soft);
    stroke-width: 1.1;
    opacity: 0.55;
  }
  .tunduk.busy .ring.r2 { animation: pulse 1.8s ease-in-out infinite; }
  .tunduk.busy .ring.r3 { animation: pulse 1.8s ease-in-out infinite 0.3s; }
  @keyframes pulse {
    0%   { opacity: 0.15; transform: scale(0.9); }
    50%  { opacity: 0.85; transform: scale(1.04); }
    100% { opacity: 0.15; transform: scale(0.9); }
  }
  .tunduk.busy .ring, .tunduk.busy .spoke { transform-origin: 50% 50%; }

  header { text-align: center; margin-bottom: 36px; }

  .eyebrow {
    font-family: 'Golos Text', sans-serif;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--gold-soft);
    margin: 0 0 10px;
  }

  h1 {
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.15;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }

  .lede {
    color: var(--ink-dim);
    font-size: 15px;
    line-height: 1.55;
    max-width: 46ch;
    margin: 0 auto;
  }

  /* --- Каармандар: legend --- */
  .cast {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin: 24px 0 32px;
  }
  .cast .tag {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 12.5px;
    color: var(--ink-dim);
  }
  .cast .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  /* --- Диалог саптары --- */
  .lines { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }

  .line-row {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 10px;
    align-items: start;
  }

  .speaker-select {
    appearance: none;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    font-family: 'Golos Text', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 9px 28px 9px 12px;
    border-radius: 9px;
    width: 132px;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%), linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
    background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    border-left: 3px solid var(--speaker-color, var(--gold));
  }

  .line-text {
    width: 100%;
    resize: vertical;
    min-height: 44px;
    background: transparent;
    border: none;
    color: var(--ink);
    font-family: 'Golos Text', sans-serif;
    font-size: 14.5px;
    line-height: 1.5;
    padding: 8px 2px;
  }
  .line-text:focus { outline: none; }
  .line-text::placeholder { color: #5B617F; }

  .remove-btn {
    background: none;
    border: none;
    color: var(--ink-dim);
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
    padding: 6px;
    border-radius: 6px;
  }
  .remove-btn:hover { color: var(--ember); background: #2A1D20; }

  .add-line {
    width: 100%;
    background: transparent;
    border: 1.5px dashed var(--line);
    color: var(--ink-dim);
    border-radius: var(--radius);
    padding: 13px;
    font-family: 'Golos Text', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 28px;
    transition: border-color 0.15s, color 0.15s;
  }
  .add-line:hover { border-color: var(--gold-soft); color: var(--gold-soft); }

  /* --- Иштетүү баскычы --- */
  .record-btn {
    width: 100%;
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    color: #1A1406;
    border: none;
    border-radius: var(--radius);
    padding: 16px;
    font-family: 'Golos Text', sans-serif;
    font-size: 15.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 8px 24px -8px rgba(203, 161, 53, 0.5);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .record-btn:active { transform: translateY(1px); }
  .record-btn:disabled {
    background: var(--panel-2);
    color: var(--ink-dim);
    box-shadow: none;
    cursor: not-allowed;
  }

  .status {
    text-align: center;
    font-size: 13px;
    color: var(--ink-dim);
    margin-top: 14px;
    min-height: 18px;
  }
  .status.err { color: #E28A86; }

  /* --- Даяр аудио --- */
  .result {
    margin-top: 26px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    display: none;
  }
  .result.show { display: block; }
  .result-label {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold-soft);
    margin: 0 0 12px;
  }
  audio { width: 100%; margin-bottom: 14px; filter: invert(0.9) hue-rotate(180deg); }
  .download-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink);
    text-decoration: none;
    padding: 10px 16px;
    border-radius: 9px;
    font-size: 13.5px;
    font-weight: 600;
  }
  .download-btn:hover { border-color: var(--gold-soft); }

  @media (max-width: 480px) {
    h1 { font-size: 25px; }
    .line-row { grid-template-columns: 1fr; }
    .speaker-select { width: 100%; }
    .remove-btn { justify-self: end; }
  }

  @media (prefers-reduced-motion: reduce) {
    .tunduk.busy .ring { animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="tunduk" id="tundukIcon">
      <svg viewBox="0 0 100 100">
        <circle class="ring r1" cx="50" cy="50" r="14"></circle>
        <circle class="ring r2" cx="50" cy="50" r="28"></circle>
        <circle class="ring r3" cx="50" cy="50" r="42"></circle>
        <line class="spoke" x1="50" y1="8"  x2="50" y2="92"></line>
        <line class="spoke" x1="8"  y1="50" x2="92" y2="50"></line>
        <line class="spoke" x1="18" y1="18" x2="82" y2="82"></line>
        <line class="spoke" x1="82" y1="18" x2="18" y2="82"></line>
      </svg>
    </div>
    <p class="eyebrow">Тундук · Үн студиясы</p>
    <h1>Диалогго добуш<br>жаздырыңыз</h1>
    <p class="lede">Ар бир каармандын сабын жазыңыз, ага өз добушун тандаңыз — Тундук бир бүтүн MP3 аудио кылып сүйлөтүп берет.</p>
  </header>

  <div class="cast" id="castLegend"></div>

  <div class="lines" id="linesContainer"></div>

  <button class="add-line" id="addLineBtn">+ Сап кошуу</button>

  <button class="record-btn" id="recordBtn">
    <span id="recordBtnLabel">Үн жаздыруу</span>
  </button>
  <p class="status" id="statusText"></p>

  <div class="result" id="resultBox">
    <p class="result-label">Даяр аудио</p>
    <audio id="player" controls></audio>
    <a class="download-btn" id="downloadLink" download="dialogue.mp3">
      ⬇ MP3 жүктөп алуу
    </a>
  </div>

</div>

<script>
(function () {
  // Сервердеги DIALOGUE_VOICES менен дал келүүчү тизме (server.js/api/dialogue-voices'тен алынат,
  // бирок API жеткиликсиз болсо ушул демейки тизме иштейт).
  const FALLBACK_VOICES = [
    { key: 'aiel_kart',  label: 'Улгайган аял',  color: '#CBA135' },
    { key: 'erkek_kart', label: 'Улгайган эркек', color: '#5E8FB8' },
    { key: 'kyz_jash',   label: 'Жаш кыз',        color: '#B8433E' },
    { key: 'jigit_jash', label: 'Жаш жигит',      color: '#6FA36F' },
  ];

  let VOICES = FALLBACK_VOICES;
  const linesContainer = document.getElementById('linesContainer');
  const castLegend = document.getElementById('castLegend');
  const addLineBtn = document.getElementById('addLineBtn');
  const recordBtn = document.getElementById('recordBtn');
  const recordBtnLabel = document.getElementById('recordBtnLabel');
  const statusText = document.getElementById('statusText');
  const resultBox = document.getElementById('resultBox');
  const player = document.getElementById('player');
  const downloadLink = document.getElementById('downloadLink');
  const tundukIcon = document.getElementById('tundukIcon');

  function renderLegend() {
    castLegend.innerHTML = VOICES.map(v =>
      `<span class="tag"><span class="dot" style="background:${v.color}"></span>${v.label}</span>`
    ).join('');
  }

  function voiceOptionsHtml(selectedKey) {
    return VOICES.map(v =>
      `<option value="${v.key}" ${v.key === selectedKey ? 'selected' : ''}>${v.label}</option>`
    ).join('');
  }

  function addLine(speakerKey, text) {
    const row = document.createElement('div');
    row.className = 'line-row';

    const select = document.createElement('select');
    select.className = 'speaker-select';
    select.innerHTML = voiceOptionsHtml(speakerKey || VOICES[0].key);

    function syncColor() {
      const v = VOICES.find(v => v.key === select.value) || VOICES[0];
      select.style.setProperty('--speaker-color', v.color);
    }
    select.addEventListener('change', syncColor);
    syncColor();

    const textarea = document.createElement('textarea');
    textarea.className = 'line-text';
    textarea.placeholder = 'Каарман эмне дейт...';
    textarea.value = text || '';
    textarea.rows = 1;
    textarea.addEventListener('input', () => {
      textarea.style.height = 'auto';
      textarea.style.height = textarea.scrollHeight + 'px';
    });

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.innerHTML = '✕';
    removeBtn.title = 'Сапты өчүрүү';
    removeBtn.addEventListener('click', () => {
      if (linesContainer.children.length <= 1) return; // жок дегенде бир сап калсын
      row.remove();
    });

    row.appendChild(select);
    row.appendChild(textarea);
    row.appendChild(removeBtn);
    linesContainer.appendChild(row);

    setTimeout(() => { textarea.style.height = textarea.scrollHeight + 'px'; }, 0);
  }

  function seedDefaultDialogue() {
    linesContainer.innerHTML = '';
    addLine('aiel_kart',  'Ой, Кутман иним, кел бери, кел! Канчадан бересиз бул алманы?');
    addLine('erkek_kart', 'Апа, элли сомдон гой. Таза, өзүбүздүн бакчанын алмасы.');
    addLine('kyz_jash',   'Байке, эже туура айтат ко, чиркин, башка жерде отуз бештен жатат.');
    addLine('jigit_jash', 'Эжеке, азыр эле, картошко да алып кетели.');
  }

  addLineBtn.addEventListener('click', () => addLine());

  function setBusy(isBusy) {
    recordBtn.disabled = isBusy;
    recordBtnLabel.textContent = isBusy ? 'Жаздырылып жатат…' : 'Үн жаздыруу';
    tundukIcon.classList.toggle('busy', isBusy);
  }

  function collectLines() {
    const rows = [...linesContainer.querySelectorAll('.line-row')];
    return rows
      .map(row => ({
        speaker: row.querySelector('.speaker-select').value,
        text: row.querySelector('.line-text').value.trim(),
      }))
      .filter(l => l.text.length > 0);
  }

  recordBtn.addEventListener('click', async () => {
    const lines = collectLines();
    if (lines.length === 0) {
      statusText.textContent = 'Жок дегенде бир каармандын сабын жазыңыз.';
      statusText.classList.add('err');
      return;
    }

    statusText.classList.remove('err');
    statusText.textContent = '';
    resultBox.classList.remove('show');
    setBusy(true);

    try {
      const res = await fetch('/api/dialogue-speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ lines }),
      });

      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Белгисиз ката');
      }

      player.src = data.mp3DataUrl;
      downloadLink.href = data.mp3DataUrl;
      resultBox.classList.add('show');
      statusText.textContent = 'Даяр — угуп же жүктөп алыңыз.';
      player.play().catch(() => {}); // автоойнотуу бөгөттөлсө, унчукпайбыз
    } catch (err) {
      statusText.textContent = 'Ката: ' + err.message;
      statusText.classList.add('err');
    } finally {
      setBusy(false);
    }
  });

  // Сервердеги учурдагы добуш тизмесин алууга аракет — болбосо демейки тизме калат.
  fetch('/api/dialogue-voices')
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(data => {
      if (Array.isArray(data.voices) && data.voices.length > 0) {
        const palette = ['#CBA135', '#5E8FB8', '#B8433E', '#6FA36F', '#9B6FB8', '#C97A3D'];
        VOICES = data.voices.map((v, i) => ({
          key: v.key,
          label: v.label,
          color: palette[i % palette.length],
        }));
      }
    })
    .catch(() => { /* демейки FALLBACK_VOICES менен иштей беребиз */ })
    .finally(() => {
      renderLegend();
      seedDefaultDialogue();
    });
})();
</script>
</body>
</html>
